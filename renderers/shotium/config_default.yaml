# 如需自定义，复制此文件为 config.yaml 进行配置
# 更新配置后需要重启
#
# 启用方式：把 config/config/renderer.yaml 里的 name 改成 shotium
#
# shotium 是裁掉 V8 的 chromium 内核，只保留 Blink 布局、Skia 光栅化、字体与图片解码和网络栈，
# 以 Node-API 的形式直接跑在 Yunzai 进程里，没有浏览器进程、没有 CDP 往返。
# 代价是模板里的 <script> 不会执行，只能渲染服务端已经填好数据的静态 HTML。

# 引擎运行方式
#   inprocess: 引擎跑在 Yunzai 进程里，单张开销最小（默认）
#   daemon:    引擎跑在独立的常驻进程里，Yunzai 重启不用重新冷启动；连接断开会自动重连
mode: inprocess

# 默认视窗（css 像素）。与 puppeteer 的默认视窗一致，保证模板布局不变
viewport:
  width: 800
  height: 600

# 设备像素比 0.01-8。喵喵的模板通过 body 上的 transform:scale 放大，这里保持 1 即可
scale: 1

# 等待策略
#   load:        DOM 解析完、所有资源请求结束就截图（默认，本地模板足够）
#   networkidle: 在 load 之后再等 500ms 无请求，每张固定多花 0.5s，只有模板会在 load 后继续拉资源时才需要
#   auto:        跟随调用方传入的 pageGotoParams.waitUntil（runtime.render 默认给的是 networkidle2）
waitUntil: load

# 页面加载超时（毫秒）。调用方 pageGotoParams.timeout 大于 0 时优先
timeout: 30000

# 默认图片类型：jpeg / png / webp。调用方传了 imgType 时优先
imgType: jpeg

# jpeg / webp 的压缩质量 1-100。调用方传了 quality 时优先
quality: 90

# 分片截图（multiPage）时单张高度（css 像素），上限 32000。调用方传了 multiPageHeight 时优先
# 这是每一片的硬上限：引擎一次布局切成若干横条，片数按 ceil(高度 / 这个值) 算，最后一片是余数
multiPageHeight: 4000

# 每渲染多少张后把引擎能重建的内存（Blink 堆、Skia 缓存）还给系统，0 表示不做
releaseMemoryEvery: 100

# HTTP 磁盘缓存目录，用于模板里引用的远程图片、字体
#   留空: 使用引擎默认目录（~/.shotium/cache 下按项目划分）
#   off:  关闭缓存
cacheDir: temp/shotium

# 磁盘缓存上限（字节），默认 256MB
cacheMaxBytes: 268435456

# 自定义 User-Agent，留空使用引擎内置
userAgent:

# daemon 模式下守护进程的空闲退出时间（毫秒），0 表示不退出
idleTimeoutMs: 300000

# 日志里附带引擎侧的耗时与网络统计
logStats: false
